name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://ytvee.github.io
      SITE_BASE: /site-landingpage
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run validate
      - run: pnpm exec playwright install --with-deps chromium
      # Тесты идут против сборки без префикса base (preview отдаёт её с корня).
      - run: SITE_BASE=/ pnpm build && pnpm test
